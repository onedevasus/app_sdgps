name: CI/CD

# Stratégie « tag-based, rebuild par palier » :
#   push develop                  → BUILD → GHCR :sha-<court> + :staging → redeploy Railway STAGING.
#   tag git v*.*.*-rc.* (PREPROD) → BUILD depuis le tag → :<tag> + :preprod → redeploy PREPROD.
#   tag git v*.*.* (PRODUCTION)   → BUILD depuis le tag → :<tag> + :production → redeploy PRODUCTION.
#
# Contrairement à l'ancienne stratégie « build once, promote », preprod et production sont ici
# de VRAIS rebuilds depuis le TAG git (pas de promotion de digest).
#
# Les jobs d'image tournent UNIQUEMENT dans le fork (onedevaus/app_sdgps, où sont les tokens
# Railway) ; l'upstream blmerio2022 y mirrore branches ET tags via sync-fork.yml.
#
# Distinction des tags (GitHub Actions n'a pas de regex) :
#   - preprod    : tag qui contient « -rc. »        (ex. v2.3.0-rc.1)
#   - production : tag SANS aucun « - »              (ex. v2.3.0) → exclut rc/alpha/beta

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # CI = tests applicatifs sur SQLite (comme l'environnement de développement).
    # ENVIRONMENT non défini → 'development' → SQLite.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt Pillow
      - name: Appliquer les migrations
        # Seed désactivé : les tests tournent sur la base de test (TESTING=True → seed déjà
        # neutralisé) ; inutile d'amorcer la base de dev jetable de la CI.
        run: SEED_INITIAL_DATA=0 python manage.py migrate
      - name: Lancer les tests
        run: python manage.py test --verbosity=2

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps
      - name: Lancer les tests unitaires (Karma / Jasmine, headless)
        run: npm run test:ci
      - name: Builder le frontend
        run: npx ng build --configuration production

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGING (push develop) : BUILD → :sha-<court> + :staging → redeploy STAGING.
  # ─────────────────────────────────────────────────────────────────────────────
  build-staging:
    needs: [test-backend, test-frontend]
    # Jobs d'image = UNIQUEMENT dans le fork (onedevaus/app_sdgps), pas dans l'upstream.
    if: github.repository != 'blmerio2022/app_sdgps' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=staging

      - name: Builder et pousser l'image racine (app complète)
        # context: . → Dockerfile racine (SPA Angular buildé PUIS servi par Django/WhiteNoise).
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Redéployer STAGING sur Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service "$RAILWAY_SERVICE" --yes

  # ─────────────────────────────────────────────────────────────────────────────
  # PREPROD (tag v*.*.*-rc.*) : BUILD depuis le tag → :<tag> + :preprod → redeploy PREPROD.
  # ─────────────────────────────────────────────────────────────────────────────
  build-preprod:
    needs: [test-backend, test-frontend]
    if: github.repository != 'blmerio2022/app_sdgps' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=preprod

      - name: Builder et pousser l'image (depuis le tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Redéployer PREPROD sur Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PREPROD }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service "$RAILWAY_SERVICE" --yes

  # ─────────────────────────────────────────────────────────────────────────────
  # PRODUCTION (tag v*.*.* sans « - ») : BUILD depuis le tag → :<tag> + :production → redeploy PROD.
  # ─────────────────────────────────────────────────────────────────────────────
  build-production:
    needs: [test-backend, test-frontend]
    if: github.repository != 'blmerio2022/app_sdgps' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=production

      - name: Builder et pousser l'image (depuis le tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Redéployer PRODUCTION sur Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service "$RAILWAY_SERVICE" --yes
