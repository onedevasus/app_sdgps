name: CI/CD

# Stratégie « build once, promote » :
#   push develop      → BUILD UNIQUE de l'image racine (Angular + Django) → GHCR :sha-<court> + :staging
#                       puis redeploy Railway STAGING.
#   push release/*    → AUCUN rebuild : re-tag du digest :staging → :preprod, redeploy Railway PREPROD.
#   push main         → AUCUN rebuild : re-tag du digest :preprod → :production (+ :latest), redeploy PROD.
# L'image livrée en production est donc EXACTEMENT celle validée en staging puis préprod.

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # CI = tests applicatifs sur SQLite (comme l'environnement de développement).
    # ENVIRONMENT non défini → 'development' → SQLite.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: pip install -r requirements.txt Pillow
      - name: Appliquer les migrations
        # Seed désactivé : les tests tournent sur la base de test (TESTING=True → seed déjà
        # neutralisé) ; inutile d'amorcer la base de dev jetable de la CI.
        run: SEED_INITIAL_DATA=0 python manage.py migrate
      - name: Lancer les tests
        run: python manage.py test --verbosity=2

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Installer les dépendances
        run: npm ci --legacy-peer-deps
      - name: Lancer les tests unitaires (Karma / Jasmine, headless)
        run: npm run test:ci
      - name: Builder le frontend
        run: npx ng build --configuration production

  # ─────────────────────────────────────────────────────────────────────────────
  # BUILD UNIQUE (develop → STAGING). Seul job qui construit réellement l'image.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    needs: [test-backend, test-frontend]
    # Jobs d'image = UNIQUEMENT dans le fork (onedevasus/app_sdgps), pas dans l'upstream.
    # → image ghcr.io/onedevasus/app_sdgps, tirée par Railway (compte onedevasus).
    if: github.repository != 'blmerio2022/app_sdgps' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=staging

      - name: Builder et pousser l'image racine (app complète)
        # context: . → Dockerfile racine (SPA Angular buildé PUIS servi par Django/WhiteNoise,
        # service unique = image que Railway exécute).
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Redéployer STAGING sur Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service "$RAILWAY_SERVICE" --yes

  # ─────────────────────────────────────────────────────────────────────────────
  # PROMOTION PREPROD (release/* → PREPROD). Aucun rebuild : re-tag du digest staging.
  # ─────────────────────────────────────────────────────────────────────────────
  promote-preprod:
    needs: [test-backend, test-frontend]
    if: github.repository != 'blmerio2022/app_sdgps' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promouvoir le digest STAGING → :preprod (copie de manifeste, sans rebuild)
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:preprod \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging

      - name: Redéployer PREPROD sur Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PREPROD }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service "$RAILWAY_SERVICE" --yes

  # ─────────────────────────────────────────────────────────────────────────────
  # PROMOTION PRODUCTION (main → PRODUCTION). Aucun rebuild : re-tag du digest preprod.
  # ─────────────────────────────────────────────────────────────────────────────
  promote-production:
    needs: [test-backend, test-frontend]
    if: github.repository != 'blmerio2022/app_sdgps' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promouvoir le digest PREPROD → :production + :latest (copie de manifeste, sans rebuild)
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:preprod

      - name: Redéployer PRODUCTION sur Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service "$RAILWAY_SERVICE" --yes
