services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-blmerio2022/app_sdgps}:latest
    container_name: sdgps-backend
    restart: unless-stopped
    ports:
      - "8085:8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend_media:/app/media
      - backend_db:/app

volumes:
  backend_media:
  backend_db:
