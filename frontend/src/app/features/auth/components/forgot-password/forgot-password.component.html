<div class="forgot-password-container">
  <h2>Mot de passe oublié</h2>
  <p class="subtitle">Entrez votre email pour recevoir un code de vérification</p>
  
  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
    <!-- Champ Email -->
    <div class="form-group">
      <label for="email">Email :</label>
      <input 
        id="email" 
        type="email" 
        formControlName="email" 
        placeholder="Votre adresse email"
        autocomplete="email"
      >
      <div *ngIf="shouldShowError('email')" class="error-message">
        <div *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">L'email est requis.</div>
        <div *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">Veuillez entrer un email valide.</div>
      </div>
    </div>

    <!-- Message de succès -->
    <div *ngIf="successMessage" class="success-message">
      {{ successMessage }}
    </div>

    <!-- Message d'erreur général -->
    <div *ngIf="errorMessage" class="error-message-global">
      {{ errorMessage }}
    </div>

    <!-- Bouton de soumission -->
    <button type="submit" [disabled]="forgotPasswordForm.invalid || isLoading">
      <span *ngIf="!isLoading">Envoyer le code</span>
      <span *ngIf="isLoading">Envoi en cours...</span>
    </button>
  </form>

  <!-- Lien retour à la connexion -->
  <p class="login-link">
    <a routerLink="/auth/login">← Retour à la connexion</a>
  </p>
</div>
