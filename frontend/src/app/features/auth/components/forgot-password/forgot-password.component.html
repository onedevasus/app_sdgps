<div class="auth-shell">

  <!-- Bascule thème clair / sombre -->
  <button type="button" class="auth-theme-toggle"
          (click)="layout.toggleTheme()"
          [title]="(layout.theme$ | async) === 'dark' ? 'Passer en mode clair' : 'Passer en mode sombre'">
    <i class="fas" [ngClass]="(layout.theme$ | async) === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
  </button>

  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo"><i class="fas fa-key"></i></div>
      <h1 class="auth-title">Mot de passe oublié</h1>
      <p class="auth-subtitle">Entrez votre email pour recevoir un code de vérification</p>
    </div>

    <form class="auth-form" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="auth-field">
        <label for="email"><i class="fas fa-envelope"></i> Email</label>
        <input class="auth-input" id="email" type="email" formControlName="email"
               placeholder="votre.email@exemple.com" autocomplete="email">
        <div *ngIf="shouldShowError('email')" class="auth-error">
          <span *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">L'email est requis.</span>
          <span *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">Veuillez entrer un email valide.</span>
        </div>
      </div>

      <div *ngIf="successMessage" class="auth-alert success">
        <i class="fas fa-circle-check"></i> {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="auth-alert error">
        <i class="fas fa-circle-exclamation"></i> {{ errorMessage }}
      </div>

      <button class="auth-btn" type="submit" [disabled]="forgotPasswordForm.invalid || isLoading">
        <i class="fas" [ngClass]="isLoading ? 'fa-spinner fa-spin' : 'fa-paper-plane'"></i>
        {{ isLoading ? 'Envoi en cours…' : 'Envoyer le code' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/auth/login"><i class="fas fa-arrow-left"></i> Retour à la connexion</a>
    </div>
  </div>
</div>
