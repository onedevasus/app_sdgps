<div class="roles-container">
  <div class="header-section">
    <h1>Rôles & Permissions</h1>
    <p class="subtitle">Gérez les rôles et leurs permissions associées</p>
  </div>

  <div class="loading-spinner" *ngIf="loading">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Chargement des rôles...</p>
  </div>

  <div class="roles-grid" *ngIf="!loading">
    <div class="role-card" *ngFor="let role of roles"
         [ngClass]="getRoleCardClass(role.id)"
         [class.selected]="selectedRole?.id === role.id"
         (click)="selectRole(role)">
      <div class="role-icon">
        <i class="fas" [ngClass]="getRoleIcon(role.id)"></i>
      </div>
      <div class="role-info">
        <h3>{{ role.name }}</h3>
        <p>{{ role.description }}</p>
      </div>
      <div class="role-stats">
        <span class="role-count">{{ role.user_count }}</span>
        <span class="role-count-label">utilisateur(s)</span>
      </div>
      <div class="role-expand">
        <i class="fas" [ngClass]="selectedRole?.id === role.id ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
      </div>
    </div>
  </div>

  <div class="permissions-section" *ngIf="selectedRole">
    <div class="section-header">
      <h2>
        <i class="fas fa-lock"></i>
        Permissions : {{ selectedRole.name }}
      </h2>
    </div>

    <div class="permissions-card" *ngIf="selectedRole.permissions && selectedRole.permissions.length > 0">
      <table class="permissions-table">
        <thead>
          <tr>
            <th>Permission</th>
            <th class="status-col">Accordée</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let perm of selectedRole.permissions">
            <td>
              <div class="perm-name">{{ perm }}</div>
            </td>
            <td class="status-col">
              <i class="fas fa-check-circle text-success"></i>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="permissions-empty" *ngIf="!selectedRole.permissions || selectedRole.permissions.length === 0">
      <i class="fas fa-info-circle"></i>
      <p>Aucune permission détaillée disponible pour ce rôle.</p>
    </div>
  </div>
</div>
